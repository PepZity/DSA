name: Update progress
on:
  schedule:
    - cron: "30 16 * * *"   # 10:00 PM IST, after both daily pushes
  workflow_dispatch:
permissions:
  contents: write
jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README
        shell: bash
        env:
          LEETCODE_TOTAL: 96
          GFG_TOTAL: 299
        run: |
          lc=$(find Leetcode -maxdepth 1 -name '*.py' 2>/dev/null | wc -l)
          gfg=$(find GFG -maxdepth 1 -name '*.py' 2>/dev/null | wc -l)

          bar() {
            local d=$1 t=$2 w=20 out=""
            local f=$(( d * w / t ))
            if [ "$f" -gt "$w" ]; then f=$w; fi
            for ((i=0; i<w; i++)); do
              if [ "$i" -lt "$f" ]; then out+="█"; else out+="░"; fi
            done
            echo "$out"
          }

          lc_pct=$(( lc * 100 / LEETCODE_TOTAL ))
          gfg_pct=$(( gfg * 100 / GFG_TOTAL ))

          export BLOCK="| Platform | Progress | Done |
          |---|---|---|
          | LeetCode | \`$(bar $lc $LEETCODE_TOTAL)\` | $lc / $LEETCODE_TOTAL ($lc_pct%) |
          | GeeksforGeeks | \`$(bar $gfg $GFG_TOTAL)\` | $gfg / $GFG_TOTAL ($gfg_pct%) |"

          python3 - <<'PY'
          import os, re
          block = os.environ["BLOCK"]
          p = "README.md"
          s = open(p, encoding="utf-8").read()
          new = "<!--PROGRESS_START-->\n" + block + "\n<!--PROGRESS_END-->"
          s = re.sub(r"<!--PROGRESS_START-->.*?<!--PROGRESS_END-->", lambda m: new, s, flags=re.S)
          open(p, "w", encoding="utf-8").write(s)
          PY

          if git diff --quiet; then echo "No change"; exit 0; fi
          git config user.name "PepZity"
          git config user.email "356571377+PepZity@users.noreply.github.com"
          git add README.md
          git commit -m "Update progress"
          git pull --rebase
          git push
