name: Daily LeetCode push
on:
  schedule:
    - cron: "30 15 * * *"   # 9:00 PM IST every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: PepZity/leetcode-queue
          token: ${{ secrets.QUEUE_TOKEN }}
          path: queue-src

      - name: Copy next solution
        run: |
          mkdir -p Leetcode
          next=""
          for f in $(ls queue-src/*.py | sort -V); do
            name=$(basename "$f")
            if [ ! -f "Leetcode/$name" ]; then next="$f"; break; fi
          done
          if [ -z "$next" ]; then echo "All done"; exit 0; fi
          cp "$next" Leetcode/
          num=$(basename "$next" .py)
          git config user.name "PepZity"
          git config user.email "356571377+PepZity@users.noreply.github.com"
          git add Leetcode
          git commit -m "Solved question $num today"
          git push
